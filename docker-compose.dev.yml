version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: better-backend
    working_dir: /app
    volumes:
      - ./src/apps/backend:/app
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: development
    command: ["python", "run.py"]

  frontend:
    build:
      context: src/apps/frontend
    container_name: better-frontend
    working_dir: /app
    volumes:
      - ./src/apps/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
